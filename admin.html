<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMEGA TRADE CENTER | Admin</title><link rel="stylesheet" href="style.css"><style>
.admin{max-width:1100px;margin:auto;padding:35px 20px 70px}.panel{background:#fff;border:1px solid #e2e4e8;border-radius:16px;padding:25px;margin-bottom:20px}.panel h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:12px;border:1px solid #dfe2e6;border-radius:9px;font:inherit}.field textarea{min-height:130px;resize:vertical}.preview{width:180px;height:180px;object-fit:cover;border-radius:12px;background:#eee;border:1px solid #ddd}.save{border:0;background:#20c66b;color:#fff;padding:12px 18px;border-radius:9px;font-weight:bold;cursor:pointer}.danger{border:0;background:#e94b4b;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}.product-admin{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #eee}.product-admin img{width:70px;height:70px;object-fit:cover;border-radius:9px;background:#eee}.product-admin .grow{flex:1}.note{color:#6c727d;line-height:1.6}.back{display:inline-block;margin-top:15px;color:#555;font-weight:bold}@media(max-width:650px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><script>if(sessionStorage.getItem("omegaAdminUnlocked")!=="yes"){location.replace("admin-login.html");}</script>
<header><div class="wrap nav"><div class="brand"><div class="logo">Ω</div><div><b>OMEGA TRADE CENTER — ADMIN</b><small>Product management</small></div></div><div class="actions"><a href="index.html">View Catalog</a> <a href="#" id="logout">Logout</a></div></div></header>
<main class="admin"><div class="panel"><h2>Add New Product</h2><p class="note">Add a photo, product name, category and description. No price field is included.</p>
<form id="productForm" class="form"><div class="field"><label>Product name</label><input id="name" required placeholder="Example: 3 Jar Mixer Grinder"></div><div class="field"><label>Category</label><input id="category" required placeholder="Example: Blenders & Grinders"></div><div class="field full"><label>Description / Specifications</label><textarea id="description" placeholder="Enter product details here..."></textarea></div><div class="field"><label>Product image</label><input id="image" type="file" accept="image/*" required><img id="preview" class="preview" alt="Image preview"></div><div class="field" style="justify-content:end"><button class="save" type="submit">Add Product to Catalog</button></div></form></div>
<div class="panel"><h2>Saved Products</h2><p class="note">Old products stay here until you choose to remove them.</p><div id="productList"></div></div><a class="back" href="index.html">← Back to product catalog</a></main>
<script>
const KEY='omegaProducts';
const defaults=[{id:1,name:'1.8L Rice Cooker',category:'Rice Cookers',description:'Product description will be added later.',image:'https://placehold.co/800x800/f1f2f4/555?text=Product+Photo'},{id:2,name:'Stand Fan',category:'Fans',description:'Product description will be added later.',image:'https://placehold.co/800x800/f1f2f4/555?text=Product+Photo'},{id:3,name:'Mixer Grinder',category:'Blenders & Grinders',description:'Product description will be added later.',image:'https://placehold.co/800x800/f1f2f4/555?text=Product+Photo'},{id:4,name:'4 Burner Gas Cooker',category:'Gas Cookers',description:'Product description will be added later.',image:'https://placehold.co/800x800/f1f2f4/555?text=Product+Photo'}];
let products=JSON.parse(localStorage.getItem(KEY)||'null')||defaults; localStorage.setItem(KEY,JSON.stringify(products));
const $=id=>document.getElementById(id); $('image').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>$('preview').src=r.result;r.readAsDataURL(f)}};
function render(){ $('productList').innerHTML=products.map(p=>`<div class="product-admin"><img src="${esc(p.image)}"><div class="grow"><b>${esc(p.name)}</b><br><small>${esc(p.category)}</small></div><button class="danger" data-id="${p.id}">Delete</button></div>`).join('')||'<p>No products yet.</p>';document.querySelectorAll('.danger').forEach(b=>b.onclick=()=>{if(confirm('Remove this product from the catalog?')){products=products.filter(p=>p.id!==+b.dataset.id);save();render()}})}
function save(){localStorage.setItem(KEY,JSON.stringify(products))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('productForm').onsubmit=e=>{e.preventDefault();const f=$('image').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{products.unshift({id:Date.now(),name:$('name').value.trim(),category:$('category').value.trim(),description:$('description').value.trim()||'Product details will be added soon.',image:r.result});save();e.target.reset();$('preview').removeAttribute('src');render();alert('Product added successfully.');};r.readAsDataURL(f)};render();
document.getElementById("logout").onclick=e=>{e.preventDefault();sessionStorage.removeItem("omegaAdminUnlocked");location.replace("admin-login.html")};</script></body></html>
